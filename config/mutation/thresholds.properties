# Minimum mutation score (%) per Gradle module, enforced on every PR by tools/ci/mutation_gate.py.
# A ratchet: raise a floor when a module's score improves, never lower one to make a PR pass.
# Measured when the suite was added (#6): audio-core 16.5% (72/436), scenes 0% (0/2208, no tests),
# audio-android 0% (0/106, no tests), app 0.04% (20/45875; two test classes).
:engine:audio-core=15
:engine:scenes=0
:engine:audio-android=0
:app=0
# The App UI's design tokens, theme and common components (ADR-0005), moved out of :app with its
# floor of 0. Raise it once the first full run has measured the module.
:design=0
# The feature architecture (ADR-0005). The kernel and the audio adapter's module hold the same floor
# as a feature core, and each feature's :core module adds `:feature:<name>:core=80` here.
:arch:kernel=80
:arch:audio=80
:feature:diagnostics:core=80
:feature:settings:core=80
:feature:playback:core=80
# Every feature core package (dev.geode.feature.<name>.core) must reach this, whatever its module
# scores overall (ADR-0003).
feature-core=80
:feature:capture:core=80
:feature:customization:core=80
:feature:library:core=80
:feature:visuals:core=80
