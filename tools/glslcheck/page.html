<!doctype html>
<meta charset="utf-8">
<canvas id="c"></canvas>
<script>
// The GL half of glslcheck. One context, one fullscreen triangle, one draw per
// job. Nothing here knows what a style is; check.mjs hands it a vertex source,
// a fragment source and a fully planned uniform list.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw new Error('no webgl2 context');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error(`compile: ${log}`);
  }
  return s;
}

function link(vertSrc, fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(`link: ${log}`);
  }
  return p;
}

// Stand-in textures. Each is named for what the app binds there so a report
// line can say which one it was.
const textures = {};
function makeTexture(name, w, h, fill) {
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) fill(x, y, data.subarray((y * w + x) * 4, (y * w + x) * 4 + 4));
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  textures[name] = t;
}
// Row 0.25 = bands (a falling spectrum), row 0.75 = a waveform. R32F in the
// app; RGBA8 here, which only changes the range the style reads, not whether
// it reads anything.
makeTexture('audio', 512, 2, (x, y, px) => {
  const v = y === 0 ? Math.max(0, 0.9 - x / 512) : 0.5 + 0.35 * Math.sin(x * 0.11);
  px[0] = px[1] = px[2] = Math.round(v * 255); px[3] = 255;
});
makeTexture('palette', 256, 1, (x, y, px) => {
  const t = x / 256;
  px[0] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * t)));
  px[1] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.33))));
  px[2] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.67))));
  px[3] = 255;
});
makeTexture('flow', 2, 2, (x, y, px) => { px[0] = px[1] = 128; px[2] = 0; px[3] = 255; });

// A Style pack's own image (#391), the real file: decoded by the browser, its bottom row first as the
// engine uploads it, with the pack's wrap and filter (a mipmapped one with its chain of halved copies).
window.__packImage = async function (image) {
  try {
    const bytes = Uint8Array.from(atob(image.png), (c) => c.charCodeAt(0));
    const bitmap = await createImageBitmap(new Blob([bytes], { type: 'image/png' }),
      { imageOrientation: 'flipY', premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
    const wrap = { repeat: gl.REPEAT, mirror: gl.MIRRORED_REPEAT, clamp: gl.CLAMP_TO_EDGE }[image.wrap];
    const filter = image.filter === 'nearest' ? gl.NEAREST : gl.LINEAR;
    if (wrap === undefined) throw new Error(`unknown wrap ${image.wrap}`);
    const t = textures[image.key] || gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    if (image.filter === 'mipmap') {
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    }
    textures[image.key] = t;
    return { width: bitmap.width, height: bitmap.height };
  } catch (e) {
    return { error: String(e.message || e) };
  }
};
makeTexture('white', 2, 2, (x, y, px) => { px[0] = px[1] = px[2] = px[3] = 255; });
// Seeded (mulberry32), not Math.random: a noise texture that changes per run made the bloom
// variants differ between runs.
const noiseRandom = (() => {
  let a = 0x9e3779b9;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();
makeTexture('noise', 64, 64, (x, y, px) => { const v = Math.floor(noiseRandom() * 256); px[0] = px[1] = px[2] = v; px[3] = 255; });
// The shared Style inputs' noise (lib_inputs.glsl), drawn as core/viz/StyleInputs.cpp draws it: the
// same hash of the Render seed, the same lattices, so a Style renders here over the noise it gets on a
// phone.
const NOISE_SEED = 0x6E0DE5;
function mix32(x) {
  x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16;
  return x >>> 0;
}
function hashCell(seed, c, x, y, z) {
  let h = mix32((seed + 0x9e3779b9) >>> 0);
  for (const v of [c, x, y, z]) h = mix32((h ^ v) >>> 0);
  return h;
}
function noisePlane(name, size, lattice) {
  const cells = size / lattice;
  const smooth = (t) => t * t * (3 - 2 * t);
  makeTexture(name, size, size, (x, y, px) => {
    const x0 = Math.floor(x / lattice), y0 = Math.floor(y / lattice);
    const x1 = (x0 + 1) % cells, y1 = (y0 + 1) % cells;
    const sx = smooth((x % lattice) / lattice), sy = smooth((y % lattice) / lattice);
    for (let c = 0; c < 4; c++) {
      const v = (cx, cy) => hashCell(NOISE_SEED, c, cx, cy, 0) >>> 24;
      const bottom = v(x0, y0) + (v(x1, y0) - v(x0, y0)) * sx;
      const top = v(x0, y1) + (v(x1, y1) - v(x0, y1)) * sx;
      px[c] = Math.round(bottom + (top - bottom) * sy);
    }
  });
}
noisePlane('noise_lq', 256, 1);
noisePlane('noise_mq', 256, 4);
noisePlane('noise_hq', 256, 8);
const volumeTextures = {};
(() => {
  const side = 32;
  const data = new Uint8Array(side * side * side * 4);
  for (let z = 0; z < side; z++) for (let y = 0; y < side; y++) for (let x = 0; x < side; x++) {
    for (let c = 0; c < 4; c++) data[((z * side + y) * side + x) * 4 + c] = hashCell(NOISE_SEED, c, x, y, z) >>> 24;
  }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, t);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, side, side, side, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  for (const wrap of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, wrap, gl.REPEAT);
  volumeTextures.noise_vol = t;
})();
// A dye field with structure: two soft coloured blobs and a filament, so a
// look that reads gradients, luminance or hue has something to chew on.
makeTexture('dye', 128, 128, (x, y, px) => {
  const u = x / 128 - 0.5, v = y / 128 - 0.5;
  const a = Math.exp(-((u + 0.15) ** 2 + (v - 0.1) ** 2) * 30);
  const b = Math.exp(-((u - 0.2) ** 2 + (v + 0.15) ** 2) * 40);
  const f = Math.exp(-((v - 0.3 * Math.sin(u * 9)) ** 2) * 400) * 0.6;
  px[0] = Math.min(255, Math.round(255 * (a * 0.9 + f * 0.8)));
  px[1] = Math.min(255, Math.round(255 * (a * 0.2 + b * 0.8 + f * 0.3)));
  px[2] = Math.min(255, Math.round(255 * (b * 0.9 + f * 0.9)));
  px[3] = 255;
});

// The finished picture of a Style, for the Shared core effects: a soft radial gradient with
// coloured rings and an off-centre bright disc, so geometry, colour and lens effects all show.
// 'scene_half' is the same picture at half the size: the outgoing Style of a transition, and a
// frame drawn below the output that the last pass upscales (core/viz/TileFrame.hpp, #311).
const scenePicture = (size) => (x, y, px) => {
  const u = x / size - 0.5, v = y / size - 0.5;
  const r = Math.hypot(u, v);
  const ring = 0.5 + 0.5 * Math.cos(r * 40);
  const disc = Math.exp(-((u - 0.18) ** 2 + (v - 0.12) ** 2) * 60);
  const stripe = (Math.floor((u + 0.5) * 8) % 2) * 0.15;
  px[0] = Math.min(255, Math.round(255 * (0.15 + 0.55 * ring * (0.5 + u) + 0.6 * disc)));
  px[1] = Math.min(255, Math.round(255 * (0.1 + 0.4 * ring * (0.5 - v) + 0.5 * disc + stripe)));
  px[2] = Math.min(255, Math.round(255 * (0.25 + 0.5 * (1 - ring) * (0.5 - u) + 0.3 * disc)));
  px[3] = 255;
};
makeTexture('scene', 128, 128, scenePicture(128));
makeTexture('scene_half', 64, 64, scenePicture(64));
// The last frame, for Trails and Motion blur: the same picture moved and brighter in places.
makeTexture('history', 128, 128, (x, y, px) => {
  const u = x / 128 - 0.5, v = y / 128 - 0.5;
  const disc = Math.exp(-((u + 0.2) ** 2 + (v + 0.15) ** 2) * 50);
  const ring = 0.5 + 0.5 * Math.cos(Math.hypot(u - 0.08, v) * 40);
  px[0] = Math.min(255, Math.round(255 * (0.1 + 0.3 * ring + 0.9 * disc)));
  px[1] = Math.min(255, Math.round(255 * (0.1 + 0.25 * ring + 0.8 * disc)));
  px[2] = Math.min(255, Math.round(255 * (0.15 + 0.2 * ring + 0.5 * disc)));
  px[3] = 255;
});

// The last frame's blur levels: the history picture blurred (a box over a 5x5 neighbourhood, wrapped).
(() => {
  const size = 32, radius = 2;
  const src = new Float32Array(size * size * 3);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size - 0.5, v = y / size - 0.5;
    const disc = Math.exp(-((u + 0.2) ** 2 + (v + 0.15) ** 2) * 50);
    const ring = 0.5 + 0.5 * Math.cos(Math.hypot(u - 0.08, v) * 40);
    src.set([0.1 + 0.3 * ring + 0.9 * disc, 0.1 + 0.25 * ring + 0.8 * disc, 0.15 + 0.2 * ring + 0.5 * disc], (y * size + x) * 3);
  }
  makeTexture('history_blur', size, size, (x, y, px) => {
    const sum = [0, 0, 0];
    for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
      const i = (((y + dy + size) % size) * size + ((x + dx + size) % size)) * 3;
      for (let c = 0; c < 3; c++) sum[c] += src[i + c];
    }
    const n = (2 * radius + 1) ** 2;
    for (let c = 0; c < 3; c++) px[c] = Math.min(255, Math.round((255 * sum[c]) / n));
    px[3] = 255;
  });
})();

// The app's FullscreenTriangle (core/render/Quad.cpp): three vertices at
// location 0. quad_vert.glsl builds its triangle from gl_VertexID and needs
// no buffer; fluid_base_vert.glsl reads aPosition and does.
const triangle = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

function upload(program, u) {
  const loc = gl.getUniformLocation(program, u.name);
  if (loc === null) return false;
  if (u.texture) {
    gl.activeTexture(gl.TEXTURE0 + u.unit);
    if (u.type === 'sampler3D') gl.bindTexture(gl.TEXTURE_3D, volumeTextures[u.texture]);
    else gl.bindTexture(gl.TEXTURE_2D, textures[u.texture]);
    gl.uniform1i(loc, u.unit);
    return true;
  }
  const v = Array.isArray(u.value) ? u.value : [u.value];
  switch (u.type) {
    case 'float': gl.uniform1fv(loc, u.count > 1 ? new Float32Array(u.count).fill(v[0]) : v); break;
    case 'int': gl.uniform1iv(loc, u.count > 1 ? new Int32Array(u.count).fill(v[0]) : v); break;
    case 'vec2': gl.uniform2fv(loc, v); break;
    case 'vec3': gl.uniform3fv(loc, v); break;
    case 'mat3': gl.uniformMatrix3fv(loc, false, v); break;
    case 'vec4': {
      const arr = new Float32Array(u.count * 4);
      for (let i = 0; i < u.count; i++) arr.set(v, i * 4);
      gl.uniform4fv(loc, arr);
      break;
    }
    default: throw new Error(`unhandled uniform type ${u.type} for ${u.name}`);
  }
  return true;
}

function frameStats(width, height) {
  const px = new Uint8Array(width * height * 4);
  gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = 0, max = 0, black = 0, blown = 0;
  const n = width * height;
  for (let i = 0; i < n; i++) {
    const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    sum += l;
    if (l > max) max = l;
    if (l < 0.02) black++;
    if (r > 0.95 && g > 0.95 && b > 0.95) blown++;
  }
  return { meanLuma: sum / n, maxLuma: max, fracBlack: black / n, fracBlown: blown / n };
}

// The scene target: an RGBA8 texture behind an FBO, as core/render/Framebuffer.cpp allocate()s it
// (linear filtering, clamped, no clear). Made on a unit no job samples: on the active one it would replace
// the texture the job's last sampler reads (a Style's uPrevFrame) with the target itself, a feedback loop
// WebGL refuses to draw.
const SCRATCH_UNIT = gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS) - 1;
function makeTarget(w, h) {
  const active = gl.getParameter(gl.ACTIVE_TEXTURE);
  gl.activeTexture(gl.TEXTURE0 + SCRATCH_UNIT);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('scene target incomplete');
  gl.activeTexture(active);
  return { tex, fbo, w, h };
}

function dropTarget(t) {
  gl.deleteFramebuffer(t.fbo);
  gl.deleteTexture(t.tex);
}

// Framebuffer::resizePreserving, step for step: a new target, the old picture blitted into it with
// linear filtering, the old target deleted. Nothing is cleared.
function resizePreserving(old, w, h) {
  const next = makeTarget(w, h);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, old.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, next.fbo);
  gl.blitFramebuffer(0, 0, old.w, old.h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.LINEAR);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  dropTarget(old);
  return next;
}

// Draws one frame into a scene target at the job's size, resizes the target to resizeWidth x
// resizeHeight the way the renderer does when the load scale moves, and reports what the resized
// target holds before anything is drawn into it again: the picture the next frame starts from.
window.__renderResized = async function (job) {
  const out = { dropped: [] };
  let program = null;
  let target = null;
  try {
    program = link(job.vert, job.frag);
    gl.useProgram(program);
    let unit = 0;
    for (const u of job.uniforms) {
      if (u.texture) u.unit = unit++;
      if (!upload(program, u)) out.dropped.push(u.name);
    }
    gl.disableVertexAttribArray(0);
    target = makeTarget(job.width, job.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, job.width, job.height);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const before = frameStats(job.width, job.height);
    target = resizePreserving(target, job.resizeWidth, job.resizeHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    Object.assign(out, frameStats(job.resizeWidth, job.resizeHeight));
    out.meanLumaBefore = before.meanLuma;
    canvas.width = job.resizeWidth;
    canvas.height = job.resizeHeight;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, target.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.blitFramebuffer(0, 0, job.resizeWidth, job.resizeHeight, 0, 0, job.resizeWidth, job.resizeHeight, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.finish();
    const err = gl.getError();
    out.glError = err === gl.NO_ERROR ? 0 : err;
    if (out.meanLuma < before.meanLuma * job.keepFraction) {
      throw new Error(`the picture went dark across the resize: mean ${before.meanLuma.toFixed(3)} -> ${out.meanLuma.toFixed(3)}`);
    }
    out.png = canvas.toDataURL('image/png').split(',')[1];
  } catch (e) {
    out.error = String(e.message || e).replace(/\n/g, ' | ');
  } finally {
    if (target) dropTarget(target);
    if (program) gl.deleteProgram(program);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  return out;
};

window.__render = async function (job) {
  const out = { dropped: [] };
  let program = null;
  try {
    canvas.width = job.width;
    canvas.height = job.height;
    program = link(job.vert, job.frag);
    gl.useProgram(program);
    let unit = 0;
    for (const u of job.uniforms) {
      if (u.texture) u.unit = unit++;
      if (!upload(program, u)) out.dropped.push(u.name);
    }
    if (job.vert.includes('aPosition')) {
      gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(0);
    }
    gl.viewport(0, 0, job.width, job.height);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // An instanced job (the 3D particle layer) draws `vertices` per instance, as the app does; a grid
    // (the feedback warp's) draws its `vertices` once.
    if (job.instances) gl.drawArraysInstanced(gl.TRIANGLES, 0, job.vertices, job.instances);
    else gl.drawArrays(gl.TRIANGLES, 0, job.vertices || 3);
    gl.finish();
    const err = gl.getError();
    out.glError = err === gl.NO_ERROR ? 0 : err;
    const px = new Uint8Array(job.width * job.height * 4);
    gl.readPixels(0, 0, job.width, job.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0, max = 0, black = 0, blown = 0;
    const n = job.width * job.height;
    for (let i = 0; i < n; i++) {
      const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      sum += l;
      if (l > max) max = l;
      if (l < 0.02) black++;
      if (r > 0.95 && g > 0.95 && b > 0.95) blown++;
    }
    out.meanLuma = sum / n;
    out.maxLuma = max;
    out.fracBlack = black / n;
    out.fracBlown = blown / n;
    out.png = canvas.toDataURL('image/png').split(',')[1];
  } catch (e) {
    out.error = String(e.message || e).replace(/\n/g, ' | ');
  } finally {
    if (program) gl.deleteProgram(program);
  }
  return out;
};
// The feedback loop's store (core/viz FeedbackWarp.hpp, check.mjs settleJobs): two targets of the job's
// format (RGBA16F, RGB10_A2 or RGBA8, as ShaderScene keeps the loop), the first cleared to white, then
// `frames` frames of the warp stage, each reading the last frame's target and drawing the other, with the
// frame counted in uFbSeed as the engine counts it. Reports the red channel's mean after `checkpoint`
// frames and its largest value at the end, read back at the target's own precision.
const TARGET_FORMATS = {
  rgba16f: { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT, extension: 'EXT_color_buffer_float' },
  rgb10a2: { internal: gl.RGB10_A2, format: gl.RGBA, type: gl.UNSIGNED_INT_2_10_10_10_REV },
  rgba8: { internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE },
};

function readRed(target, size, kind) {
  const n = size * size;
  const red = new Float64Array(n);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, target.fbo);
  if (kind === 'rgba16f') {
    const px = new Float32Array(n * 4);
    gl.readPixels(0, 0, size, size, gl.RGBA, gl.FLOAT, px);
    for (let i = 0; i < n; i++) red[i] = px[i * 4];
  } else if (kind === 'rgb10a2') {
    const px = new Uint32Array(n);
    gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_INT_2_10_10_10_REV, px);
    for (let i = 0; i < n; i++) red[i] = (px[i] & 1023) / 1023;
  } else {
    const px = new Uint8Array(n * 4);
    gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, px);

// order, A first, each reading every buffer's newest picture (lib_buffers' uBufA..uBufD; one a pass has not
// declared reads black) and drawing into its other target, with uBufFrame counting the frames and uBufPass
