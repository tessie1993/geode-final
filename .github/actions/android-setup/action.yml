name: Android build setup
description: >-
  JDK 21, Gradle with its cache (read-only on pull requests) and the Android SDK packages the build
  needs. The NDK and CMake versions match ndkVersion and externalNativeBuild.cmake.version in
  app/build.gradle.kts.
inputs:
  native:
    description: Also install the NDK and CMake (needed by anything that packages the app).
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle and cache
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Install Android SDK packages
      shell: bash
      env:
        NATIVE: ${{ inputs.native }}
      # sdkmanager is not on PATH on the ubuntu-24.04 runner image; resolve it from the
      # preinstalled SDK location instead.
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        packages=("platform-tools" "platforms;android-37" "build-tools;36.0.0")
        if [ "$NATIVE" = "true" ]; then
          packages+=("ndk;28.0.13004108" "cmake;3.22.1")
        fi
        "$SDKMANAGER" "${packages[@]}"
        chmod +x gradlew
