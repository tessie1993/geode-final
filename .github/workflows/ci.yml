name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # The runner's preinstalled SDK has cmdline-tools; the script adds platform 37.0 (preview
      # channel), build-tools, NDK and CMake, and writes local.properties.
      - run: tools/setup-android-sdk.sh "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # JVM modules have no testDebugUnitTest, so `test` (debug + release unit tests) covers both kinds.
      - run: ./gradlew assembleDebug test ktlintCheck detekt --continue
