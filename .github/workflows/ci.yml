name: CI

# The whole test suite, on every pull request (docs/ci.md). Every job is a gate: a ticket is done
# when all of them are green. Nothing is built or tested anywhere else; agents never build locally.
# Pushes to main are handled by ship-apk.yml, which builds and publishes the APK.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CONTEXT.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Package APK and checksum
        id: package
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          FILE_NAME="Geode-${VERSION_NAME:-debug}-${GITHUB_SHA::7}-debug.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$FILE_NAME"
          sha256sum "dist/$FILE_NAME" > "dist/$FILE_NAME.sha256"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
      # Convenience, not a gate: a full artifact store must never turn a good build red.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: geode-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.file_name }}
            dist/${{ steps.package.outputs.file_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  static-analysis:
    name: Lint (detekt, ktlint, Android lint)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - name: detekt (every module)
        run: ./gradlew detekt --continue --stacktrace --no-daemon
      # detekt prints only "Analysis failed with N weighted issues"; the findings go to report
      # files. Print them so a failure is readable from the log.
      - name: Show detekt findings
        if: failure()
        run: |
          for f in $(find . -path '*/build/reports/detekt/detekt.txt' -not -path './build-logic/*'); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: ktlint
        run: ./gradlew ktlintCheck --continue --stacktrace --no-daemon
      # Origin markers in engine sources must agree with docs/visualizer-v2/provenance.json.
      - name: Provenance
        run: ./gradlew checkEngineProvenance --continue --stacktrace --no-daemon
      - name: Android lint (every Android module)
        run: ./gradlew :app:lintDebug :engine:scenes:lintDebug :engine:audio-android:lintDebug --continue --stacktrace --no-daemon
      - name: Show lint findings
        if: failure()
        run: |
          for f in $(find . -path '*/build/reports/lint-results-debug.txt'); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_number }}
          path: "**/build/reports/"
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Kotlin unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      # audio-core is a JVM module: its tests run under `test`, not `testDebugUnitTest`.
      - name: Unit tests (every module)
        run: ./gradlew :engine:audio-core:test testDebugUnitTest --continue --stacktrace --no-daemon
      - name: Coverage reports
        if: success() || failure()
        run: ./gradlew koverXmlReport --continue --stacktrace --no-daemon
      - name: Coverage summary
        if: success() || failure()
        run: python3 tools/ci/coverage_summary.py $(find . -path '*/build/reports/kover/report.xml' -not -path './build-logic/*')
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: Mutation tests ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ":engine:audio-core"
            task: ":engine:audio-core:pitest"
            dir: engine/audio-core
            name: audio-core
          - module: ":engine:scenes"
            task: ":engine:scenes:pitestDebug"
            dir: engine/scenes
            name: scenes
          - module: ":engine:audio-android"
            task: ":engine:audio-android:pitestDebug"
            dir: engine/audio-android
            name: audio-android
          - module: ":app"
            task: ":app:pitestDebug"
            dir: app
            name: app
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - name: Run every mutant (${{ matrix.task }})
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon
      - name: Mutation score gate
        env:
          MODULE: ${{ matrix.module }}
          DIR: ${{ matrix.dir }}
        run: |
          report=$(find "$DIR/build/reports/pitest" -name mutations.xml | head -n 1)
          if [ -z "$report" ]; then echo "::error::no mutations.xml under $DIR/build/reports/pitest"; exit 1; fi
          python3 tools/ci/mutation_gate.py "$MODULE" "$report" config/mutation/thresholds.properties
      - name: Upload mutation report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.dir }}/build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 14

  screenshots:
    name: App UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The head commit itself (not the merge commit): its message decides record vs verify,
          # and recorded goldens are pushed on top of it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/android-setup
      - name: Record or verify
        id: mode
        run: |
          if git log -1 --format=%B | grep -qF '[record-goldens]'; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify screenshots against the goldens
        if: steps.mode.outputs.record == 'false'
        run: |
          if ! ls app/src/test/screenshots/*.png > /dev/null 2>&1; then
            echo "::error::no App UI goldens in app/src/test/screenshots; record them (docs/ci.md)"
            exit 1
          fi
          ./gradlew :app:verifyRoborazziDebug --stacktrace --no-daemon
      - name: Record screenshots
        if: steps.mode.outputs.record == 'true'
        run: ./gradlew :app:recordRoborazziDebug --stacktrace --no-daemon
      - name: Push recorded screenshots
        if: steps.mode.outputs.record == 'true' && github.event_name == 'pull_request'
        run: tools/ci/commit_goldens.sh "${{ github.head_ref }}" "Record App UI screenshot goldens" app/src/test/screenshots
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-${{ github.run_number }}
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  native-tests:
    name: C++ unit tests (host, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Each native library may include only its own headers and its dependencies' public ones
      # (docs/native-libraries.md). The self-test first proves the check still catches violations.
      - name: Native library include boundaries
        run: |
          python3 tools/ci/check_native_includes.py --self-test
          python3 tools/ci/check_native_includes.py
      - name: Check out kissfft
        run: git submodule update --init --depth 1 third_party/kissfft
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S core/host -B build-host -DCMAKE_BUILD_TYPE=Debug -DGEODE_SANITIZE=ON
      - name: Build
        run: cmake --build build-host --parallel
      - name: Test
        run: ctest --test-dir build-host --output-on-failure
      # Compiles every viz/, render/ and util/ translation unit with the project flags and links them with
      # --no-undefined against Mesa's GLES: the link the NDK does, without an NDK.
      - name: Host link check (tools/hostlink)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgles-dev libegl-dev
          tools/hostlink/hostlink.sh

  # Geode's copy of projectM, built on the host and run under Mesa's software GLES: two Renders of
  # the same song and settings must give byte-identical frames (ADR-0005, "Renders are frame-exact").
  milkdrop-frame-exact:
    name: MilkDrop Renders are frame-exact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out projectM
        run: git submodule update --init --recursive --depth 1 third_party/projectm
      - name: Install Mesa (EGL, GLES 3, software rasterizer)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgles-dev libegl-dev libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S tools/milkdrop-determinism -B build-milkdrop -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-milkdrop --parallel
      - name: Two Renders, byte for byte
        run: ctest --test-dir build-milkdrop --output-on-failure

  visual-frames:
    name: Visual golden frames (shaders)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # SwiftShader output is deterministic on a fixed Chrome build; a floating version would make
      # the goldens drift with every runner update.
      - name: Install pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 140
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Render every Style (compile + non-black frame)
        env:
          MUSICVIZ_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tools/glslcheck/check.mjs --all --size 96 --time 12.5 --out build-frames/styles
          node tools/glslcheck/check.mjs --fluid-display --size 96 --out build-frames/fluid
      - name: Record or verify
        id: mode
        run: |
          if git log -1 --format=%B | grep -qF '[record-goldens]'; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with the goldens
        if: steps.mode.outputs.record == 'false'
        run: |
          python3 tools/ci/compare_frames.py tools/glslcheck/goldens/styles build-frames/styles
          python3 tools/ci/compare_frames.py tools/glslcheck/goldens/fluid build-frames/fluid
      - name: Record goldens
        if: steps.mode.outputs.record == 'true' && github.event_name == 'pull_request'
        run: |
          rm -rf tools/glslcheck/goldens
          mkdir -p tools/glslcheck/goldens
          cp -r build-frames/styles build-frames/fluid tools/glslcheck/goldens/
          tools/ci/commit_goldens.sh "${{ github.head_ref }}" "Record Visual golden frames" tools/glslcheck/goldens
      - name: Upload rendered frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-frames-${{ github.run_number }}
          path: build-frames/
          if-no-files-found: ignore
          retention-days: 14

  play-gates:
    name: Play Store gates
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      # Unsigned here: the upload key exists only in release.yml, which checks the signature.
      # checkNativePageAlignment finalizes assembleRelease and fails on any .so below 16 KB.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Gates (targetSdk, permissions, 16 KB zip alignment)
        run: tools/ci/play_gates.sh app/build/outputs/apk/release/app-release-unsigned.apk

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan this pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: Scan the working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Instrumented tests need a real Android runtime: MediaStore, a live MediaSession and the
  # permission model do not exist off a device, and Robolectric's shadows misreport some of them.
  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      # The emulator needs hardware acceleration; ubuntu runners expose KVM but not to
      # unprivileged processes by default.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 29 is the floor for the scoped-storage paths these tests cover.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geode-instrumented-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
