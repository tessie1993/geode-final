name: CI

# The test suite, on every pull request (docs/ci.md). The first job reads the files the pull request
# changes and picks the jobs that read them (tools/ci/select_jobs.py, "Which checks run" in docs/ci.md):
# a module's tests run when the module or something it depends on changed, a check runs when one of its
# inputs did, and a change to this workflow runs everything, as does [ci-full] in the head commit's
# message. Every job that runs is a gate; the CI job at the end is green only when all of them are,
# and is the one check to require. Nothing is built or tested anywhere else; agents never build locally.
# Pushes to main are handled by ship-apk.yml, which builds and publishes the APK.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      static_analysis: ${{ steps.select.outputs.static_analysis }}
      unit_tests: ${{ steps.select.outputs.unit_tests }}
      unit_test_tasks: ${{ steps.select.outputs.unit_test_tasks }}
      mutation: ${{ steps.select.outputs.mutation }}
      mutation_matrix: ${{ steps.select.outputs.mutation_matrix }}
      native_mutation: ${{ steps.select.outputs.native_mutation }}
      native_mutation_matrix: ${{ steps.select.outputs.native_mutation_matrix }}
      analysis_parts: ${{ steps.select.outputs.analysis_parts }}
      native_tests: ${{ steps.select.outputs.native_tests }}
      native_concurrency: ${{ steps.select.outputs.native_concurrency }}
      milkdrop_frame_exact: ${{ steps.select.outputs.milkdrop_frame_exact }}
      visual_frames: ${{ steps.select.outputs.visual_frames }}
      play_gates: ${{ steps.select.outputs.play_gates }}
      secrets: ${{ steps.select.outputs.secrets }}
      notices: ${{ steps.select.outputs.notices }}
      dependency_review: ${{ steps.select.outputs.dependency_review }}
      instrumented_tests: ${{ steps.select.outputs.instrumented_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits deep, so the PR's head commit is here too: its message can ask for [ci-full]
          # or [api-dump].
          fetch-depth: 2
      # On a pull request HEAD is the merge of the head into the base, so a diff against the base is
      # exactly the change the pull request makes. Anything else (workflow_dispatch) runs everything.
      - name: The files this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : > changed.txt
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
          fi
          echo "::group::$(wc -l < changed.txt) changed file(s)"; cat changed.txt; echo "::endgroup::"
      # The self-test first proves the selection on known changes; the table of what runs and why goes
      # to the run's summary.
      - name: Select the jobs
        id: select
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/ci/select_jobs.py --self-test
          flags=()
          [ "$GITHUB_EVENT_NAME" = pull_request ] || flags+=(--all)
          message=$(git log -1 --format=%B "$HEAD_SHA")
          case "$message" in *"[ci-full]"*) flags+=(--all) ;; esac
          case "$message" in *"[api-dump]"*) flags+=(--also static-analysis) ;; esac
          python3 tools/ci/select_jobs.py --changed changed.txt "${flags[@]}" \
            --github-output "$GITHUB_OUTPUT" --explain | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build debug APK
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Package APK and checksum
        id: package
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          FILE_NAME="Geode-${VERSION_NAME:-debug}-${GITHUB_SHA::7}-debug.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$FILE_NAME"
          sha256sum "dist/$FILE_NAME" > "dist/$FILE_NAME.sha256"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
      # Convenience, not a gate: a full artifact store must never turn a good build red.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: geode-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.file_name }}
            dist/${{ steps.package.outputs.file_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  static-analysis:
    name: Lint (detekt, ktlint, Android lint, public API)
    needs: changes
    if: needs.changes.outputs.static_analysis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Write access only to push regenerated public API dumps back to the PR ([api-dump]).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits deep, so the PR's head commit is here too: its message can ask for [api-dump].
          fetch-depth: 2
      - uses: ./.github/actions/android-setup
      - name: detekt (every module)
        run: ./gradlew detekt --continue --stacktrace --no-daemon
      # detekt prints only "Analysis failed with N weighted issues"; the findings go to report
      # files. Print them so a failure is readable from the log.
      - name: Show detekt findings
        if: failure()
        run: |
          for f in $(find . -path '*/build/reports/detekt/detekt.txt' -not -path './build-logic/*'); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: ktlint
        run: ./gradlew ktlintCheck --continue --stacktrace --no-daemon
      # The public API of :arch:* and every feature's :api must match its dump in <module>/api
      # (geode.api-dump). A head commit whose message contains [api-dump] regenerates the dumps
      # instead, and pushes them to the PR branch (docs/ci.md).
      - name: Public API (check, or dump on [api-dump])
        id: api
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git log -1 --format=%B "$HEAD_SHA" | grep -qF '[api-dump]'; then
            ./gradlew updateKotlinAbi --stacktrace --no-daemon
            echo "dumped=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew checkKotlinAbi --continue --stacktrace --no-daemon
          fi
      - name: Push the public API dumps
        if: steps.api.outputs.dumped == 'true' && github.event_name == 'pull_request'
        run: |
          dumps=$(find . \( -path ./build-logic -o -name build -o -name .git \) -prune -o -type d -name api -print | while read -r dir; do
            if ls "$dir"/*.api > /dev/null 2>&1; then echo "${dir#./}"; fi
          done)
          if [ -z "$dumps" ]; then echo "::error::updateKotlinAbi wrote no dumps"; exit 1; fi
          tools/ci/commit_goldens.sh "${{ github.head_ref }}" "Dump the public API" $dumps
      # Origin markers in engine sources must agree with docs/visualizer-v2/provenance.json.
      - name: Provenance
        run: ./gradlew checkEngineProvenance --continue --stacktrace --no-daemon
      - name: Android lint (every Android module)
        run: ./gradlew lintDebug --continue --stacktrace --no-daemon
      - name: Show lint findings
        if: failure()
        run: |
          for f in $(find . -path '*/build/reports/lint-results-debug.txt'); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_number }}
          path: "**/build/reports/"
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Kotlin unit tests and coverage
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      # One task name for every module: the JVM modules answer to it too (geode.jvm-library). The
      # changes job names the modules the change can reach: the touched ones and their dependents, or
      # all of them when the build itself changed. Unquoted on purpose: one word per task.
      - name: Unit tests (the modules this change reaches)
        env:
          TASKS: ${{ needs.changes.outputs.unit_test_tasks }}
        run: ./gradlew $TASKS --continue --stacktrace --no-daemon
      - name: Coverage reports
        if: success() || failure()
        run: ./gradlew koverXmlReport --continue --stacktrace --no-daemon
      - name: Coverage summary
        if: success() || failure()
        run: python3 tools/ci/coverage_summary.py $(find . -path '*/build/reports/kover/report.xml' -not -path './build-logic/*')
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One job per module with a floor in config/mutation/thresholds.properties, for the modules the
  # change reaches (the changes job; every module when the build or the gate changed).
  mutation:
    name: Mutation tests ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mutation_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - name: Run every mutant (${{ matrix.task }})
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon
      - name: Mutation score gate
        env:
          MODULE: ${{ matrix.module }}
          DIR: ${{ matrix.dir }}
        run: |
          report=$(find "$DIR/build/reports/pitest" -name mutations.xml | head -n 1)
          if [ -z "$report" ]; then echo "::error::no mutations.xml under $DIR/build/reports/pitest"; exit 1; fi
          python3 tools/ci/mutation_gate.py "$MODULE" "$report" config/mutation/thresholds.properties
      - name: Upload mutation report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.dir }}/build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 14

  # Mull over the host GoogleTest suite, one pure native library per job (docs/ci.md, "C++ mutation
  # tests"). Mull's compiler plugin builds every mutant into the test binary; mull-runner switches them
  # on one at a time and runs the whole suite against each. A library with more mutants than fit the
  # job's time limit runs in parts, each a share of its files (tools/ci/mull_part.py).
  native-mutation:
    name: C++ mutation tests ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.native_mutation == 'true'
    runs-on: ubuntu-24.04
    # Every mutant runs the whole native suite (about 15 s on this runner, four at a time); the
    # Visual's library has the most mutants and outgrew an hour.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One entry per library the change reaches (the changes job), from NATIVE_MUTATION_PARTS in
      # tools/ci/select_jobs.py: a library whose mutants outgrow one job runs in parts, and
      # native-mutation-gate scores the parts' reports as one library. geode_viz is paused there.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_mutation_matrix) }}
    env:
      # Mull is built per LLVM major; 18 is the runner's clang. Pinned to an exact package and its hash.
      LLVM_MAJOR: "18"
      MULL_VERSION: "0.34.1"
      MULL_DEB: Mull-18-0.34.1-LLVM-18.1.3-ubuntu-amd64-24.04.deb
      MULL_DEB_SHA256: 983ea9c84ecab621414d5442a66c1a1ce4127491b79d42fd5e2fd6fe01d02699
      # Read by the compiler plugin while building and by mull-runner: config/mutation/mull.yml, or
      # for a part of a library, that config narrowed to the part's files (the step below).
      MULL_CONFIG: ${{ github.workspace }}/mull-config/mull.yml
    steps:
      - uses: actions/checkout@v7
      - name: Check out kissfft
        run: git submodule update --init --depth 1 third_party/kissfft
      - name: Mull's configuration (the whole library, or this part of it)
        env:
          PART: ${{ matrix.part }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          mkdir -p mull-config
          if [ -n "$PART" ]; then
            python3 tools/ci/mull_part.py --self-test
            python3 tools/ci/mull_part.py config/mutation/mull.yml "$DIR" "$PART" mull-config/mull.yml
          else
            cp config/mutation/mull.yml mull-config/mull.yml
          fi
      - name: Install Mull
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/$MULL_DEB"
          curl -sSfL -o "$deb" \
            "https://dl.cloudsmith.io/public/mull-project/mull-stable/deb/ubuntu/pool/noble/main/M/Mu/mull-${LLVM_MAJOR}_${MULL_VERSION}/$MULL_DEB"
          echo "$MULL_DEB_SHA256  $deb" | sha256sum --check --strict
          sudo apt-get update -q
          sudo apt-get install -y -q "$deb"
          "mull-runner-$LLVM_MAJOR" --version
      - name: Configure (${{ matrix.library }} mutated)
        env:
          CC: clang-${{ env.LLVM_MAJOR }}
          CXX: clang++-${{ env.LLVM_MAJOR }}
        run: |
          cmake -S core/host -B build-mutation -DCMAKE_BUILD_TYPE=Debug \
            -DGEODE_MUTATE=${{ matrix.library }} -DGEODE_MULL_PLUGIN=/usr/lib/mull-ir-frontend-$LLVM_MAJOR
      - name: Build
        run: cmake --build build-mutation --parallel --target geode_core_tests
      # Every mutant runs (the build has no coverage filter); one no test reaches survives.
      # mull-runner's own threshold is off: the gate below decides.
      # Each mutant's test process is held to 3 GB of address space (four run at once on a 16 GB
      # runner): a mutant that allocates without end then dies of bad_alloc, a detected mutant,
      # instead of taking the runner down with it (geode_analysis lost its runner to a "shutdown
      # signal" part-way through on #426 and #427; the suite itself needs well under 1 GB).
      - name: Run every mutant
        run: |
          ulimit -v 3145728
          "mull-runner-$LLVM_MAJOR" --include-not-covered --allow-surviving \
            --reporters Elements --report-dir mutation-report --report-name ${{ matrix.library }} \
            build-mutation/geode_core_tests
      # A part's report is scored with the other parts' in native-mutation-gate.
      - name: Mutation score gate
        if: ${{ !matrix.part }}
        run: |
          python3 tools/ci/native_mutation_gate.py ${{ matrix.library }} \
            mutation-report/${{ matrix.library }}.json ${{ matrix.dir }} config/mutation/native-thresholds.properties
      - name: Upload mutation report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-mutation-${{ matrix.name }}-${{ github.run_number }}
          path: mutation-report/
          if-no-files-found: ignore
          retention-days: 14

  # geode_analysis runs in parts (native-mutation); its parts' reports are joined
  # (tools/ci/merge_mutation_reports.py) and scored as one library, against its one floor.
  native-mutation-gate:
    name: C++ mutation score geode_analysis
    needs: [changes, native-mutation]
    # Also when a part failed: fewer reports than parts fails the gate with a message, never by absence.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.analysis_parts != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The number of geode_analysis parts in native-mutation's matrix (NATIVE_MUTATION_PARTS).
      PARTS: ${{ needs.changes.outputs.analysis_parts }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the parts' reports
        uses: actions/download-artifact@v7
        with:
          pattern: native-mutation-geode_analysis-*-${{ github.run_number }}
          path: parts
      - name: Join the parts' reports
        run: |
          set -euo pipefail
          python3 tools/ci/merge_mutation_reports.py --self-test
          mkdir -p mutation-report
          python3 tools/ci/merge_mutation_reports.py --parts "$PARTS" mutation-report/geode_analysis.json parts/*/geode_analysis.json
          # The same viewer page as a part's, over the joined report.
          for html in parts/*/geode_analysis.html; do cp "$html" mutation-report/geode_analysis.html; break; done
      - name: Mutation score gate
        run: |
          python3 tools/ci/native_mutation_gate.py geode_analysis \
            mutation-report/geode_analysis.json core/analysis config/mutation/native-thresholds.properties
      - name: Upload the joined report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-mutation-geode_analysis-${{ github.run_number }}
          path: mutation-report/
          if-no-files-found: ignore
          retention-days: 14

  native-tests:
    name: C++ unit tests (host, ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.native_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Each native library may include only its own headers and its dependencies' public ones
      # (docs/native-libraries.md). The self-test first proves the check still catches violations.
      - name: Native library include boundaries
        run: |
          python3 tools/ci/check_native_includes.py --self-test
          python3 tools/ci/check_native_includes.py
      # The dependency diagram in docs/native-libraries.md is generated from LIBRARY_DEPS; it must match.
      - name: Native dependency diagram is current
        run: |
          python3 tools/ci/native_graph_doc.py --self-test
          python3 tools/ci/native_graph_doc.py --check
      # The snapshot schema generates the C, C++ and Kotlin bridge types; they must match what is committed.
      - name: Bridge schema is current
        run: python3 tools/bridge_schema/generate.py --check
      - name: Check out kissfft
        run: git submodule update --init --depth 1 third_party/kissfft
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S core/host -B build-host -DCMAKE_BUILD_TYPE=Debug -DGEODE_SANITIZE=ON
      - name: Build
        run: cmake --build build-host --parallel
      - name: Test
        run: ctest --test-dir build-host --output-on-failure
      # Compiles every viz/, render/ and util/ translation unit with the project flags and links them with
      # --no-undefined against Mesa's GLES: the link the NDK does, without an NDK.
      - name: Host link check (tools/hostlink)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgles-dev libegl-dev
          tools/hostlink/hostlink.sh

  native-concurrency:
    name: C++ concurrency tests (host, TSan)
    needs: changes
    if: needs.changes.outputs.native_concurrency == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out kissfft
        run: git submodule update --init --depth 1 third_party/kissfft
      # ThreadSanitizer's shadow memory needs a narrower address-space randomisation than the runner's default.
      - name: Make room for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S core/host -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DGEODE_SANITIZE_THREAD=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      # The lock-free Customization hand-off (core/bridge): its unit tests and its concurrent stress tests.
      - name: Test the lock-free hand-off
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure --no-tests=error -R 'TripleBuffer|SnapshotExchange'

  # Geode's copy of projectM, built on the host and run under Mesa's software GLES: two Renders of
  # the same song and settings must give byte-identical frames (ADR-0005, "Renders are frame-exact"),
  # and every bundled preset must run as written, with no shader silently replaced by the default.
  milkdrop-frame-exact:
    name: MilkDrop Renders are frame-exact
    needs: changes
    if: needs.changes.outputs.milkdrop_frame_exact == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out projectM
        run: git submodule update --init --recursive --depth 1 third_party/projectm
      - name: Install Mesa (EGL, GLES 3, software rasterizer)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgles-dev libegl-dev libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S tools/milkdrop-determinism -B build-milkdrop -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-milkdrop --parallel
      - name: Two Renders, byte for byte
        run: ctest --test-dir build-milkdrop --output-on-failure -R frame_exact
      - name: Every bundled preset runs as written
        run: ctest --test-dir build-milkdrop --output-on-failure -R preset

  # A cheap shader check with no stored images: every Style's shader must compile and draw a lit
  # frame, survive a scene-target resize without going dark, and every Shared core effect and every
  # Layer 2 blend mode and influence must draw.
  # glslang then holds every Style to the GLSL ES 3.00 specification, which ANGLE may not.
  visual-frames:
    name: Shaders compile and render
    needs: changes
    if: needs.changes.outputs.visual_frames == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 140
      # Every Style is a data pack (docs/style-packs.md); the shaders below are rendered from them.
      - name: Validate every Style pack
        run: |
          python3 tools/ci/check_style_packs.py --self-test
          python3 tools/ci/check_style_packs.py
      - name: Render every Style (compile + non-black frame)
        env:
          MUSICVIZ_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tools/glslcheck/check.mjs --all --size 96 --time 12.5 --out build-frames/styles
          node tools/glslcheck/check.mjs --fluid-display --size 96 --out build-frames/fluid
          node tools/glslcheck/check.mjs --all --resize --size 96 --time 12.5 --out build-frames/resize
          node tools/glslcheck/check.mjs --effects --size 96 --out build-frames/effects
          node tools/glslcheck/check.mjs --layers --size 96 --out build-frames/layers
      # glslangValidator is a CI-only tool: nothing of it ships in the app.
      - name: Install glslang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools
      - name: Check every Style with glslang (GLSL ES 3.00)
        run: |
          node tools/glslcheck/check.mjs --glslang-self-test
          node tools/glslcheck/check.mjs --all --glslang
      - name: Upload rendered frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-frames-${{ github.run_number }}
          path: build-frames/
          if-no-files-found: ignore
          retention-days: 14

  play-gates:
    name: Play Store gates
    needs: changes
    if: needs.changes.outputs.play_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      # Unsigned here: the upload key exists only in release.yml, which checks the signature.
      # checkNativePageAlignment finalizes assembleRelease and fails on any .so below 16 KB.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Gates (targetSdk, permissions, 16 KB zip alignment)
        run: tools/ci/play_gates.sh app/build/outputs/apk/release/app-release-unsigned.apk

  secrets:
    name: Secret scan
    needs: changes
    if: needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan this pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: Scan the working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose .

  # The notices the app ships (THIRD_PARTY_NOTICES and its in-app copy) stay true to what it bundles.
  # The self-test first proves the check still catches drift.
  notices:
    name: Third-party notices
    needs: changes
    if: needs.changes.outputs.notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Notices match what the app ships
        run: |
          python3 tools/ci/check_notices.py --self-test
          python3 tools/ci/check_notices.py

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependency_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Permissive licences only (THIRD_PARTY_NOTICES): a new or changed dependency under any
          # other licence fails. LGPL is allowed only for a native shared library, which Gradle
          # dependencies are not, so it is not listed. JUnit 4 (EPL-1.0) is test-only.
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, BSL-1.0, 0BSD,
            CC0-1.0, Unlicense, OFL-1.1, Unicode-3.0, Unicode-DFS-2016
          allow-dependencies-licenses: pkg:maven/junit/junit

  # Instrumented tests need a real Android runtime: MediaStore, a live MediaSession and the
  # permission model do not exist off a device, and Robolectric's shadows misreport some of them.
  instrumented-tests:
    name: Instrumented tests (emulator)
    needs: changes
    if: needs.changes.outputs.instrumented_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/android-setup
        with:
          native: "true"
      # The emulator needs hardware acceleration; ubuntu runners expose KVM but not to
      # unprivileged processes by default.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # minSdk: the oldest Android the app installs on.
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geode-instrumented-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # The one check to require on main: green when every job this change needed is green. A skipped job
  # was not needed; a failed, cancelled or missing one fails this, and so does a failed selection.
  ci:
    name: CI
    needs:
      - changes
      - build
      - static-analysis
      - unit-tests
      - mutation
      - native-mutation
      - native-mutation-gate
      - native-tests
      - native-concurrency
      - milkdrop-frame-exact
      - visual-frames
      - play-gates
      - secrets
      - notices
      - dependency-review
      - instrumented-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this change needed is green
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .changes.result == "success"
            and ([.[] | .result] | all(. == "success" or . == "skipped"))' > /dev/null
