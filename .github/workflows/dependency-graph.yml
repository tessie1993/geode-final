name: Dependency graph

# Submits the resolved Gradle dependencies to GitHub so dependency review on pull requests
# (ci.yml) and Dependabot alerts can see them; Gradle is not in GitHub's static graph.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@v6
