name: CodeQL

# Code-safety scan of the Kotlin and C++ code (docs/ci.md). Findings appear under Security > Code
# scanning and as PR annotations.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin analysis needs a real compile; a cached build would hide sources from the tracer.
          - language: java-kotlin
            build-mode: manual
          # NDK cross-compiles are not something the C++ tracer follows; none-mode reads the source.
          - language: c-cpp
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Kotlin
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew :engine:audio-core:compileKotlin :engine:scenes:compileDebugKotlin
          :engine:audio-android:compileDebugKotlin :engine:live:compileDebugKotlin :app:compileDebugKotlin
          --no-build-cache --rerun-tasks --no-configuration-cache --stacktrace --no-daemon
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
