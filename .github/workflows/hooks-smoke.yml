name: Pre-commit smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hooks-smoke.yml'
      - '.pre-commit-config.yaml'
      - '.clang-format'
      - '.cmake-format.yaml'
      - 'tools/hooks/**'
      - 'docs/GIT_HOOKS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooks-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out without native submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install and verify pinned smoke tooling
        run: |
          echo "PRE_COMMIT_HOME=$RUNNER_TEMP/pre-commit-smoke" >> "$GITHUB_ENV"
          python -m pip install -r tools/hooks/requirements-smoke.txt
          python -m pip check
          python --version
          python -m pre_commit --version
      - name: Validate configuration and Python syntax
        run: |
          python -m pre_commit validate-config
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ('.pre-commit-config.yaml', '.clang-format', '.cmake-format.yaml', '.github/workflows/hooks-smoke.yml'):
              yaml.safe_load(Path(name).read_text())
          for path in Path('tools/hooks').glob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          PY
      - name: Run offline dependency regression tests
        run: python -m unittest discover -s tools/hooks -p 'test_*.py' -v
      - name: Install the actual pinned hook environments
        run: python -m pre_commit install-hooks
      - name: Exercise staged fixtures and check-only behavior
        run: python tools/hooks/smoke_pre_commit.py -v
