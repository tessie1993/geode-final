[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"
media3 = "1.11.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
material3Adaptive = "1.3.0"
glance = "1.1.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
ktlint = "14.2.0"
detekt = "1.23.8"
# CI suite (#6). Versions from the CI tools research (#5).
pitestGradle = "1.19.0"
pitestAndroidGradle = "0.3.0"
pitest = "1.30.1"
kover = "0.9.11"
robolectric = "4.17"
orgJson = "20240303"
# Architecture test of ADR-0003 (#33), test scope only.
konsist = "0.17.3"
# Settings in DataStore (ADR-0004, #38).
datastore = "1.1.7"
# Playback's playlists, play history and saved session (#34, ADR-0004 storage).
room = "2.8.4"
androidxTestCore = "1.7.0"
# The App UI's navigation graph (#136).
navigation3 = "1.2.0"
# Frosted glass over Compose content (#324): Haze's backdrop capture and blur, Apache-2.0. Only its
# haze and haze-blur modules; no refraction (haze-glass).
haze = "2.0.1"

[libraries]
documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
# FileProvider, for sharing the diagnostics file through the share sheet (#62).
androidx-core = { module = "androidx.core:core", version = "1.16.0" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

ktlint-gradle = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint" }
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
pitest-gradle = { module = "info.solidsoft.pitest:info.solidsoft.pitest.gradle.plugin", version.ref = "pitestGradle" }
pitest-android-gradle = { module = "pl.droidsonroids.pitest:pl.droidsonroids.pitest.gradle.plugin", version.ref = "pitestAndroidGradle" }
kover-gradle = { module = "org.jetbrains.kotlinx.kover:org.jetbrains.kotlinx.kover.gradle.plugin", version.ref = "kover" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
